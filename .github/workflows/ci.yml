name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: typecheck, build, self-test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swiftc --version

      - name: Typecheck
        run: bash scripts/build.sh typecheck

      - name: Build
        run: bash scripts/build.sh build

      - name: Headless self-test
        run: ./build/PaintCraft.app/Contents/MacOS/PaintCraft --selftest

  dmg:
    name: universal DMG (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build universal DMG
        run: bash scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintCraft-dmg
          path: |
            build/PaintCraft-*-universal.dmg
            build/PaintCraft-*-universal.dmg.sha256
